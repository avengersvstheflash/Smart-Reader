<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="55%" stop-color="#5b21b6"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background with soft gradient -->
  <rect width="1024" height="1024" rx="180" fill="url(#bg)"/>

  <!-- Sigil centered, scaled to ~62.5% of canvas (640x640) -->
  <!-- Original sigil is 48x48 -> scale 13.333x -->
  <g fill="none" transform="translate(512, 512) scale(13.333) translate(-24, -24)" filter="url(#glow)">
    <circle cx="24" cy="24" r="22" stroke="#d8b4fe" stroke-width="1.5" stroke-dasharray="3 2" />
    <circle cx="24" cy="24" r="16" stroke="#c084fc" stroke-width="1" />
    <rect x="10.5" y="10.5" width="27" height="27" stroke="#a855f7" stroke-width="1.2" />
    <rect x="10.5" y="10.5" width="27" height="27" stroke="#a855f7" stroke-width="1.2" transform="rotate(45 24 24)" />
    <circle cx="24" cy="24" r="7.5" stroke="#f472b6" stroke-width="1.2" />
    <polygon points="24,19 28,24 24,29 20,24" fill="#ffffff" />
    <circle cx="24" cy="2" r="1.8" fill="#f472b6" />
    <circle cx="24" cy="46" r="1.8" fill="#f472b6" />
    <circle cx="2" cy="24" r="1.8" fill="#f472b6" />
    <circle cx="46" cy="24" r="1.8" fill="#f472b6" />
    <circle cx="8.4" cy="8.4" r="1.2" fill="#c084fc" />
    <circle cx="39.6" cy="8.4" r="1.2" fill="#c084fc" />
    <circle cx="8.4" cy="39.6" r="1.2" fill="#c084fc" />
    <circle cx="39.6" cy="39.6" r="1.2" fill="#c084fc" />
  </g>
</svg>
