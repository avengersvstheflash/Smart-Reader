[package]
name = "omnitome"
version = "1.0.0"
description = "Omnitome - Local-first neural reading library"
edition = "2021"
rust-version = "1.77"
license = "AGPL-3.0-only"

[lib]
name = "omnitome_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

